services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: copilot
    ports:
      - "5432:5432"
    networks:
      - app-network

  api:
    build: ./
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    networks:
      - app-network
    command: >
      bash -c "
        echo 'Running migrations...' &&
        alembic upgrade head &&
        echo 'Starting FastAPI application...' &&
        uvicorn app.main:app --reload --port 8000 --host 0.0.0.0
      "

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - app-network

  worker:
    build: ./
    depends_on:
      - db
      - redis
    env_file:
      - .env
    volumes:
      - .:/app
    networks:
      - app-network
    command: celery -A app.worker.celery worker --loglevel=info

networks:
  app-network:
    driver: bridge